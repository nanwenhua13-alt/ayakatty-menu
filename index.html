*{box-sizing:border-box}body{margin:0;background:#f7f0e5;color:#33231d;font:16px/1.6 'Noto Sans CJK JP',sans-serif}

ss="grid"><article><label class="pick"><input type="checkbox" value="デミグラスオムライス定食"><h3>デミグラスオムライス定食</h3></label><p>オニオンスープ付き</p><small>ミニパスタを追加できます</small><select aria-label="デミグラスオムライス定食の選択肢" disabled><option>ミニパスタなし</option><option>ミニパスタ付き</option></select></article><article><label class="pick"><input type="checkbox" value="カレー定食"><h3>カレー定食</h3></label><p>スープ・サラダ付き</p></article><article><label class="pick"><input type="checkbox" value="牛丼定食"><h3>牛丼定食</h3></label><p>お味噌汁・サラダ付き</p></article><article><label class="pick"><input type="checkbox" value="ハンバーグセット"><h3>ハンバーグセット</h3></label><p>ご飯・お味噌汁・サラダ付き</p></article></div></section><section><h2>お寿司・海鮮</h2><div class="grid"><article><label class="pick"><input type="checkbox" value="海鮮丼セット"><h3>海鮮丼セット</h3></label><p>蕎麦またはうどん付き</p><small>お好きな麺を選べます</small><select aria-label="海鮮丼セットの選択肢" disabled><option>蕎麦付き</option><option>うどん付き</option></select></article><article><label class="pick"><input type="checkbox" value="ちらし寿司"><h3>ちらし寿司</h3></label></article></div></section><section><h2>鍋・汁もの</h2><div class="grid"><article><label class="pick"><input type="checkbox" value="鍋"><h3>鍋</h3></label><p>味はお好みやその日の気分で</p><select aria-label="鍋の選択肢" disabled><option>おまかせ</option><option>希望の味を指定する</option></select><input type="text" aria-label="鍋の希望の味" placeholder="希望の味を入力" maxlength="60" hidden disabled></article><article><label class="pick"><input type="checkbox" value="豚汁セット"><h3>豚汁セット</h3></label><p>おにぎり・ミニおかず付き</p></article></div></section><footer><div id="count" aria-live="polite"></div>
<button type="button" id="line" disabled>LINEでリクエスト</button><button type="button" class="secondary" id="copy" disabled>文章をコピー</button>
<textarea id="message" aria-label="リクエスト文" readonly hidden></textarea><p id="status" role="status"></p></footer></main>
<script>
const cards = Array.from(document.querySelectorAll('article'));
const line = document.querySelector('#line');
const copy = document.querySelector('#copy');
const message = document.querySelector('#message');
const status = document.querySelector('#status');
const count = document.querySelector('#count');

function sync() {
  const dishes = [];
  let missingFlavor = false;
  for (const card of cards) {
    const pick = card.querySelector('input[type=checkbox]');
    const select = card.querySelector('select');
    const flavor = card.querySelector('input[type=text]');
    if (select) select.disabled = !pick.checked;
    if (flavor) {
      const needsFlavor = pick.checked && select.selectedIndex === 1;
      flavor.hidden = !needsFlavor;
      flavor.disabled = !needsFlavor;
      missingFlavor ||= needsFlavor && !flavor.value.trim();
    }
    if (pick.checked) {
      const option = flavor && !flavor.disabled ? flavor.value.trim() : select?.value;
      dishes.push('・' + pick.value + (option ? '（' + option + '）' : ''));
    }
  }
  count.textContent = dishes.length ? dishes.length + '品を選択中' : '料理を選んでください';
  line.disabled = copy.disabled = !dishes.length || missingFlavor;
  message.value = dishes.length ? '🍴 あやかってぃ’s食堂にリクエスト！\n' + dishes.join('\n') + '\n今度食べたいです☺️' : '';
  message.hidden = !dishes.length;
  status.textContent = missingFlavor ? '鍋の希望の味を入力してください。' : '';
}

document.querySelector('main').addEventListener('input', sync);
line.addEventListener('click', () => {
  window.location.href = 'https://line.me/R/share?text=' + encodeURIComponent(message.value);
});
copy.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(message.value);
    status.textContent = 'コピーしました。LINEのトークに貼り付けて送れます。';
  } catch {
    message.focus();
    message.select();
    status.textContent = '選択された文章をコピーしてください。';
  }
});
sync();
</script>
